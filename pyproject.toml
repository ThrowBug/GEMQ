[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "proquant"
version = "0.1.0"
description = "ProQuant: PoP allocation and RoCo fine-tuning for Qwen3 MoE quantization"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/AWQ-LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.8.0",
    "transformers>=4.57.0,<5",
    "accelerate>=1.10.1",
    "datasets>=4.3.0",
    "huggingface-hub>=0.34.0,<1.0",
    "hqq>=0.2.8",
    "gemlite>=0.5.1",
    "triton>=3.4.0",
    "numpy>=2.2.6",
    "scipy>=1.9",
    "tqdm",
    "sentencepiece>=0.2.1",
    "protobuf>=6.32.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Optional alternative ILP backend. The default is HiGHS, which ships with SciPy,
# so no license is needed; Gurobi is what the committed configs/ were solved with.
gurobi = ["gurobipy>=12.0.3"]

[tool.setuptools.packages.find]
include = ["proquant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "cuda: requires a CUDA device",
    "checkpoint: requires --model-path",
]
