[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proquant"
version = "0.1.0"
description = "ProQuant for Qwen3.5-MoE quantization"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.8.0",
    "transformers==5.2.0",
    "tokenizers==0.22.2",
    "accelerate>=1.10.1",
    "datasets>=4.3.0",
    "huggingface-hub==1.3.0",
    "hf-xet==1.6.0",
    "numpy>=2.2.6",
    "scipy>=1.9",
    "tqdm",
    "sentencepiece>=0.2.1",
    "protobuf>=6.32.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Optional alternative ILP backend. The default is HiGHS, which ships with SciPy,
# so no additional solver installation is needed.
gurobi = ["gurobipy>=12.0.3"]

[tool.setuptools.packages.find]
include = ["proquant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "cuda: requires a CUDA device",
    "checkpoint: requires --model-path",
]
